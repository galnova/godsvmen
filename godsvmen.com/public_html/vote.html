<!doctype html>
<html lang="en" id="top">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Character Vote — Gods V. Men</title>
  <meta name="description" content="Select your fighter. Choose your side. Enter the Forever Fight.">

  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="css/global.css" rel="stylesheet">
  <link href="css/vote.css" rel="stylesheet">
</head>

<body class="gvm cs-body">

  <header class="sticky-top gvm-header" id="header">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html" aria-label="Gods V. Men Home">
          <img src="img/gvm-logo-long.png" alt="GVM logo" class="gvm-logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#gvmNav" aria-controls="gvmNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="gvmNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="https://greyvoth.com">Greyvoth</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/">GVM</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="tournDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Tournaments</a>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="tournDropdown">
                <li><a class="dropdown-item" href="swordsayers/">Swordsayers</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#contact">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" aria-current="page" href="vote.html">Fan Vote</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="cs-main">
    <section class="cs-stage">

      <div class="cs-heading">
        <h1 class="cs-title">Fan Vote</h1>
        <p class="cs-subtitle">Who do you want me to draw next?</p>
      </div>

      <div class="cs-banner" id="csBanner" data-state="idle">
        Choose a fighter and cast your vote
      </div>

      <div class="cs-above">

        <div class="cs-preview" id="previewPanel">
          <div class="cs-preview_portrait">
            <div class="cs-preview_placeholder" id="previewPlaceholder">?</div>
            <img class="cs-preview_img cs-preview_img--hidden" id="previewImg" src="" alt="">
          </div>
          <div class="cs-preview_info">
            <p class="cs-preview_name" id="previewName">Who will you vote for?</p>
            <p class="cs-preview_house" id="previewHouse"></p>
            <p class="cs-preview_job" id="previewJob"></p>
            <!-- <a class="cs-preview_bio" id="previewBio" href="#" target="_blank" aria-hidden="true">View Bio</a> -->
          </div>
          <div class="cs-vote-lock" id="voteLockPanel" hidden>
            <button class="cs-undo-btn" id="undoBtn">Change your vote</button>
          </div>
        </div>

        <aside class="cs-results" id="resultsPanel" aria-label="Vote Results">
          <h2 class="cs-results_title">Rankings</h2>
          <div class="cs-results_list" id="voteResults">
            <p class="cs-results_empty">No votes yet — be first!</p>
          </div>
        </aside>

      </div>

      <div class="cs-grid-wrap">
        <div class="cs-grid-spinner" id="gridSpinner"></div>
        <div class="cs-grid" id="csGrid" role="grid" aria-label="Character Vote Grid"></div>
      </div>
    </section>
  </main>

  <div class="modal fade" id="voteConfirmModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content cs-modal">
        <div class="modal-body text-center p-4">
          <p class="cs-modal_prompt">Cast your vote for</p>
          <p class="cs-modal_name" id="voteModalName">---</p>
          <div class="cs-modal_actions">
            <button class="cs-vote-btn" id="voteConfirmBtn">Vote</button>
            <button class="cs-modal_cancel" data-bs-dismiss="modal">Cancel</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="js/gvm.js"></script>
  <script src="js/global.js"></script>
  <script src="js/vote.js"></script>
</body>
</html>

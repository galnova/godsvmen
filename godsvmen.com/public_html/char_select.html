<!doctype html>
<html lang="en" id="top">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Character Select — Gods V. Men</title>
  <meta name="description" content="Select your fighter. Choose your side. Enter the Forever Fight.">

  <link rel="icon" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ABeeZee:ital@0;1&display=swap" rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="css/global.css" rel="stylesheet">
  <link href="css/char_select.css" rel="stylesheet">
</head>

<body class="gvm cs-body">

  <header class="sticky-top gvm-header" id="header">
    <nav class="navbar navbar-expand-lg">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center gap-2" href="index.html" aria-label="Gods V. Men Home">
          <img src="img/gvm-logo-long.png" alt="GVM logo" class="gvm-logo">
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#gvmNav" aria-controls="gvmNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="gvmNav">
          <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
            <li class="nav-item">
              <a class="nav-link" href="https://greyvoth.com">Greyvoth</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/">GVM</a>
            </li>
            <li class="nav-item dropdown">
              <a class="nav-link dropdown-toggle" href="#" id="tournDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">Tournaments</a>
              <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="tournDropdown">
                <li><a class="dropdown-item" href="swordsayers/">Swordsayers</a></li>
              </ul>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="index.html#contact">Contact</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="cs-main">
    <section class="cs-stage">

      <div class="cs-heading">
        <h1 class="cs-title">Character Select</h1>
        <p class="cs-subtitle">Choose your fighter. Enter the Forever Fight.</p>
      </div>

      <div class="cs-turn-banner" id="csTurnBanner" data-turn="p1">
        Player 1 — Select Fighter
      </div>

      <div class="cs-arena">

        <aside class="cs-panel cs-panel--p1" id="p1Panel" aria-label="Player 1">
          <div class="cs-panel__header">
            <span class="cs-panel__badge">P1</span>
          </div>
          <div class="cs-panel__portrait-wrap">
            <div class="cs-panel__placeholder" id="p1Placeholder">?</div>
            <img class="cs-panel__img cs-panel__img--hidden" id="p1Img" src="" alt="">
          </div>
          <div class="cs-panel__info">
            <p class="cs-panel__name" id="p1Name">---</p>
            <p class="cs-panel__house" id="p1House"></p>
            <p class="cs-panel__job" id="p1Job"></p>
            <a class="cs-panel__bio" id="p1Bio" href="#" target="_blank" aria-hidden="true">View Bio</a>
          </div>
        </aside>

        <div class="cs-grid-wrap">
          <div class="cs-grid" id="csGrid" role="grid" aria-label="Character Select Grid"></div>
        </div>

        <aside class="cs-panel cs-panel--p2" id="p2Panel" aria-label="Player 2">
          <div class="cs-panel__header">
            <span class="cs-panel__badge">P2</span>
          </div>
          <div class="cs-panel__portrait-wrap">
            <div class="cs-panel__placeholder" id="p2Placeholder">?</div>
            <img class="cs-panel__img cs-panel__img--hidden" id="p2Img" src="" alt="">
          </div>
          <div class="cs-panel__info">
            <p class="cs-panel__name" id="p2Name">---</p>
            <p class="cs-panel__house" id="p2House"></p>
            <p class="cs-panel__job" id="p2Job"></p>
            <a class="cs-panel__bio" id="p2Bio" href="#" target="_blank" aria-hidden="true">View Bio</a>
          </div>
        </aside>

      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmVqGUvFMcK3U7Q5DkqzBV8pSBC" crossorigin="anonymous"></script>
  <script src="js/gvm.js"></script>
  <script src="js/global.js"></script>
  <script src="js/char_select.js"></script>
</body>
</html>
